name: Build & Release ffgui

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            target: x86_64-unknown-linux-gnu

          - os: windows-latest
            os_name: Windows
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin ffgui

      - name: Package Linux release
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/ffgui-linux-x86_64
          cp target/${{ matrix.target }}/release/ffgui dist/ffgui-linux-x86_64/
          cp target/${{ matrix.target }}/release/ffgui ffgui-linux-x86_64
          cp -r codecs dist/ffgui-linux-x86_64/
          cp -r tools dist/ffgui-linux-x86_64/
          cp README.md dist/ffgui-linux-x86_64/
          tar -czvf ffgui-linux-x86_64.tar.gz -C dist ffgui-linux-x86_64

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ffgui-windows-x86_64
          Copy-Item target/${{ matrix.target }}/release/ffgui.exe dist/ffgui-windows-x86_64/
          Copy-Item target/${{ matrix.target }}/release/ffgui.exe ffgui-windows-x86_64.exe
          Copy-Item -Recurse codecs dist/ffgui-windows-x86_64/
          Copy-Item -Recurse tools dist/ffgui-windows-x86_64/
          Copy-Item README.md dist/ffgui-windows-x86_64/
          Compress-Archive -Path dist/ffgui-windows-x86_64/* -DestinationPath ffgui-windows-x86_64.zip -Force

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            ffgui-linux-x86_64.tar.gz
            ffgui-linux-x86_64
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            ffgui-windows-x86_64.zip
            ffgui-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -la artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || 'ffgui - Latest Build' }}
          files: |
            artifacts/ffgui-windows-x86_64.exe
            artifacts/ffgui-windows-x86_64.zip
            artifacts/ffgui-linux-x86_64
            artifacts/ffgui-linux-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
