id = "hevc_qsv"
kind = "video"
label = "H.265 / HEVC (Intel QuickSync)"
hw = "qsv"
containers = ["mkv", "mp4", "mov", "ts"]

[[param]]
id = "global_quality"
label = "Qualità globale (ICQ)"
flag = "-global_quality"
type = "int"
min = 1
max = 51
default = 25
hint = "Qualità costante ICQ: 20-28 consigliato (valori più bassi = qualità maggiore)"

[[param]]
id = "preset"
label = "Preset velocità / qualità"
flag = "-preset"
type = "choice"
choices = ["veryfast", "faster", "fast", "medium", "slow", "slower", "veryslow"]
default = "medium"
hint = "veryslow = massima compressione, veryfast = massima velocità"

[[preset]]
id = "max"
label = "Massima qualità"
values = { global_quality = 20, preset = "slower" }

[[preset]]
id = "media"
label = "Qualità media"
values = { global_quality = 25, preset = "medium" }

[[preset]]
id = "rapido"
label = "Veloce"
values = { global_quality = 30, preset = "faster" }

[[param]]
id = "b_v"
label = "Bitrate video (es. 1500k, vuoto = automatico)"
flag = "-b:v"
type = "string"
hint = "Imposta un bitrate video fisso; lascia vuoto per CRF/CQ"
