id = "hevc_amf"
kind = "video"
label = "H.265 / HEVC (AMD AMF)"
hw = "amf"
containers = ["mkv", "mp4", "mov", "ts"]

[[param]]
id = "quality"
label = "Preset qualità / velocità"
flag = "-quality"
type = "choice"
choices = ["speed", "balanced", "quality"]
default = "quality"
hint = "Bilanciamento tra velocità di codifica e qualità visiva"

[[param]]
id = "usage"
label = "Profilo di utilizzo"
flag = "-usage"
type = "choice"
choices = ["transcoding", "high_quality", "lowlatency"]
default = "transcoding"
hint = "transcoding = ideale per conversione file"

[[param]]
id = "qp_i"
label = "Quantizzazione QP (Frame I)"
flag = "-qp_i"
type = "int"
min = 0
max = 51
default = 24
hint = "Più basso = qualità maggiore (20-28 consigliato)"

[[param]]
id = "qp_p"
label = "Quantizzazione QP (Frame P)"
flag = "-qp_p"
type = "int"
min = 0
max = 51
default = 26
hint = "Più basso = qualità maggiore"

[[preset]]
id = "max"
label = "Massima qualità"
values = { quality = "quality", qp_i = 20, qp_p = 22 }

[[preset]]
id = "media"
label = "Qualità media"
values = { quality = "balanced", qp_i = 24, qp_p = 26 }

[[preset]]
id = "rapido"
label = "Veloce"
values = { quality = "speed", qp_i = 28, qp_p = 30 }
