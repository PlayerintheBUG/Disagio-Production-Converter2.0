id = "av1_nvenc"
kind = "video"
label = "AV1 (NVIDIA NVENC, CUDA)"
hw = "nvenc"
containers = ["mkv", "mp4", "webm"]

# --- Parametri ---

[[param]]
id = "rc"
label = "Controllo bitrate (Rate Control)"
flag = "-rc"
type = "choice"
choices = ["vbr", "cbr", "constqp"]
default = "vbr"
hint = "VBR (qualità costante raccomandata), CBR (bitrate fisso), ConstQP"

[[param]]
id = "cq"
label = "Qualità (CQ)"
flag = "-cq"
type = "int"
min = 0
max = 51
default = 26
only_if = { param = "rc", in = ["vbr"] }
hint = "Più basso = qualità maggiore. 22-28 è il range consigliato per AV1"

[[param]]
id = "b_v"
label = "Bitrate video"
flag = "-b"
type = "choice"
choices = ["2M", "4M", "8M", "12M", "20M"]
default = "8M"
only_if = { param = "rc", in = ["cbr"] }
hint = "Bitrate video fisso per modalità CBR"

[[param]]
id = "qp"
label = "Quantizzazione (QP)"
flag = "-qp"
type = "int"
min = 0
max = 51
default = 24
only_if = { param = "rc", in = ["constqp"] }
hint = "Quantizzazione costante per modalità ConstQP"

[[param]]
id = "preset"
label = "Velocità / qualità"
flag = "-preset"
type = "choice"
choices = ["p1", "p2", "p3", "p4", "p5", "p6", "p7"]
default = "p5"
hint = "p1 (massima velocità) .. p7 (massima qualità)"

[[param]]
id = "tune"
label = "Ottimizzazione (Tune)"
flag = "-tune"
type = "choice"
choices = ["hq", "ll", "ull", "lossless"]
default = "hq"
hint = "hq (alta qualità), ll (bassa latenza)"

[[param]]
id = "pix_fmt"
label = "Formato colore"
flag = "-pix_fmt"
type = "choice"
choices = ["yuv420p", "p010le"]
default = "yuv420p"
hint = "yuv420p (8-bit standard), p010le (10-bit)"

# --- Preset ---

[[preset]]
id = "max"
label = "Massima qualità"
values = { rc = "vbr", cq = 22, preset = "p7", tune = "hq", pix_fmt = "p010le" }

[[preset]]
id = "media"
label = "Qualità media (bilanciata)"
values = { rc = "vbr", cq = 26, preset = "p5", tune = "hq", pix_fmt = "yuv420p" }

[[preset]]
id = "bassa"
label = "Bassa (molto veloce)"
values = { rc = "vbr", cq = 32, preset = "p2", tune = "hq", pix_fmt = "yuv420p" }
