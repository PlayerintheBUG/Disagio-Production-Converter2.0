id = "av1_amf"
kind = "video"
label = "AV1 (AMD AMF)"
hw = "amf"
containers = ["mkv", "mp4", "webm"]

[[param]]
id = "quality"
label = "Preset qualità / velocità"
flag = "-quality"
type = "choice"
choices = ["speed", "balanced", "quality"]
default = "quality"
hint = "Bilanciamento tra velocità di codifica e qualità visiva"

[[param]]
id = "usage"
label = "Profilo di utilizzo"
flag = "-usage"
type = "choice"
choices = ["transcoding", "high_quality", "lowlatency"]
default = "transcoding"
hint = "transcoding = ideale per conversione file"

[[param]]
id = "qp_i"
label = "Quantizzazione QP (Frame I)"
flag = "-qp_i"
type = "int"
min = 0
max = 51
default = 26
hint = "Più basso = qualità maggiore (22-28 consigliato per AV1)"

[[param]]
id = "qp_p"
label = "Quantizzazione QP (Frame P)"
flag = "-qp_p"
type = "int"
min = 0
max = 51
default = 28
hint = "Più basso = qualità maggiore"

[[preset]]
id = "max"
label = "Massima qualità"
values = { quality = "quality", qp_i = 22, qp_p = 24 }

[[preset]]
id = "media"
label = "Qualità media"
values = { quality = "balanced", qp_i = 26, qp_p = 28 }

[[preset]]
id = "rapido"
label = "Veloce"
values = { quality = "speed", qp_i = 30, qp_p = 32 }

[[param]]
id = "rc"
label = "Controllo bitrate (Rate Control)"
flag = "-rc"
type = "choice"
choices = ["cqp", "cbr", "vbr_peak"]
hint = "cqp = qualità costante, cbr/vbr = bitrate (lascia vuoto per il default del driver)"

[[param]]
id = "b_v"
label = "Bitrate video (es. 1500k, vuoto = automatico)"
flag = "-b:v"
type = "string"
hint = "Imposta un bitrate video fisso; lascia vuoto per CRF/CQ"
